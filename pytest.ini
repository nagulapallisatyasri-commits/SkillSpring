[pytest]
# ========================================================
# SkillSpring — pytest Configuration
# ========================================================

# Test discovery root
testpaths = tests/test_cases

# Output verbosity
addopts =
    -v
    --tb=short
    --html=tests/reports/html/report.html
    --self-contained-html

# Markers for test categorisation
markers =
    tc01: TC01 - Course search and level verification
    tc02: TC02 - Enrolment in open course
    tc03: TC03 - Full course enrolment rejection
    tc04: TC04 - New tab window switching
    tc05: TC05 - Lesson progress marking
    tc06: TC06 - Quiz submission and scoring
    tc07: TC07 - My Learning table traversal
    tc08: TC08 - Locked lesson access prevention
    smoke: Quick smoke-check tests
    demo_failure: Intentional failure test to demonstrate screenshot capture
    chrome: Target Google Chrome browser
    edge: Target Microsoft Edge browser

